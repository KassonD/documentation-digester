[project]
name = "documentation-digester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kasson Davis", email = "135732515+KassonD@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
documentation-digester = "documentation_digester:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"