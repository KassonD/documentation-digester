<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="icon.png">
  <script>
    // Nessesary here because we need to load the theme before the app is loaded - prevents flickering
    try {
      if (localStorage.getItem('theme') === 'nebula') {
        document.documentElement.dataset.theme = 'nebula';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
