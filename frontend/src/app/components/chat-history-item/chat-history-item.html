<div class="item" [class.selected]="selected()" [class.menu-open]="menu()">
  @if (editing()) {
    <input
      [value]="draft()"
      (input)="onDraft($event)"
      (keydown.enter)="save()"
      (keydown.escape)="cancel()"
      (blur)="save()"
      aria-label="Chat title"
      autofocus
    />
  } @else {
    <button type="button" class="title" (click)="choose()">{{ title() }}</button>
    <button
      type="button"
      class="edit"
      aria-label="Chat options"
      aria-haspopup="menu"
      [attr.aria-expanded]="menu()"
      (click)="toggleMenu($event)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4L18 10l-4-4L4 16v4zM13 7l4 4" />
      </svg>
    </button>
    @if (menu()) {
      <div class="menu" role="menu" [class.above]="menuAbove()">
        <button type="button" role="menuitem" (click)="rename()">Rename</button>
        <button type="button" role="menuitem" (click)="remove()">Delete</button>
      </div>
    }
  }
</div>
