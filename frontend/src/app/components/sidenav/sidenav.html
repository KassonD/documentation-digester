<div class="panel">
<div class="brand-bar">
  <button type="button" class="toggle" (click)="toggle()" [attr.aria-expanded]="open()" aria-label="Toggle sidebar">
    <img src="/icon.png" alt="" />
  </button>
  <p class="brand">Godot Docbot</p>
</div>
<button type="button" class="new-chat" (click)="create()">+ New chat...</button>
<ul>
  @for (chat of chats(); track $index) {
    <li>
      <app-chat-history-item
        [title]="chat"
        [selected]="selectedIndex() === $index"
        (titleChange)="rename($index, $event)"
        (selectedChange)="select($index)"
      />
    </li>
  }
</ul>
</div>
